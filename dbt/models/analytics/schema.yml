version: 2
models:
  - name: daily_waste_summary
    columns:
      - name: waste_date
        tests: [not_null, unique]
      - name: total_food_waste_kg
        tests: [not_null]
  - name: category_waste_summary
    columns:
      - name: waste_category
        tests: [not_null, unique]
      - name: total_food_waste_kg
        tests: [not_null]
  - name: monthly_waste_summary
    columns:
      - name: waste_month
        tests: [not_null, unique]
      - name: total_food_waste_kg
        tests: [not_null]
